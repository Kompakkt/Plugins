@let item = optionItem();
<div class="result-label-id">
  <div class="result-label">{{ item | getLabel }}</div>
  <div class="result-id result-muted">{{ item.id.split('/').pop() }}</div>
</div>
<div class="result-description result-muted">
  {{ item.description || 'No description available' }}
</div>
